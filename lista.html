<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="./img/checklist.png" type="image/png">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @import "tailwindcss";
    </style>
    <title>Lista</title>
</head>

<body
  class="relative min-h-screen overflow-x-hidden font-[Outfit,Segoe_UI,Tahoma,Geneva,Verdana,sans-serif] text-[#e5eef7] bg-linear-to-br from-[#091833] via-[#114b5f] to-[#1a936f]">
  <div class="pointer-events-none absolute -left-10 -top-14 z-0 h-[180px] w-[180px] min-[220px]:h-[220px] min-[220px]:w-[220px] min-[320px]:h-[280px] min-[320px]:w-[280px] rounded-full bg-[#29f2ff] opacity-25 min-[220px]:opacity-35 blur-[70px] min-[320px]:blur-[80px] animate-pulse"></div>
  <div class="pointer-events-none absolute -right-20 top-[30%] z-0 h-[190px] w-[190px] min-[220px]:h-[230px] min-[220px]:w-[230px] min-[320px]:h-[300px] min-[320px]:w-[300px] rounded-full bg-[#d9ff00] opacity-25 min-[220px]:opacity-35 blur-[70px] min-[320px]:blur-[80px] animate-pulse [animation-delay:1.2s]"></div>
  <div class="pointer-events-none absolute -bottom-14 min-[320px]:-bottom-20 left-[30%] min-[320px]:left-[35%] z-0 h-[170px] w-[170px] min-[220px]:h-[210px] min-[220px]:w-[210px] min-[320px]:h-[260px] min-[320px]:w-[260px] rounded-full bg-[#00e5a8] opacity-25 min-[220px]:opacity-35 blur-[65px] min-[320px]:blur-[80px] animate-pulse [animation-delay:2s]"></div>

  <main class="relative z-10 py-3 px-2 min-[180px]:py-4 min-[180px]:px-2.5 min-[320px]:py-6 min-[320px]:px-3 sm:py-12 sm:px-4 md:py-16">
    <h1 class="text-center text-[14px] min-[180px]:text-lg min-[240px]:text-xl min-[320px]:text-2xl sm:text-4xl md:text-5xl font-extrabold text-[#c6d6a0] mb-3 sm:mb-5 tracking-tight leading-tight px-1">
      Lista de Compras
    </h1>
    <p class="mx-auto max-w-4xl text-center text-[10px] min-[180px]:text-[11px] min-[240px]:text-xs min-[320px]:text-sm sm:text-base md:text-lg font-semibold text-[#b7c6d9] leading-relaxed px-1 min-[240px]:px-2 mb-6 min-[320px]:mb-8 sm:mb-10">
      Agrega productos al carrito y consulta cuántos elementos llevas guardados.
    </p>

    <section class="mt-3 min-[320px]:mt-4 mx-auto w-full max-w-5xl rounded-2xl px-2 py-4 min-[180px]:px-3 min-[240px]:px-4 min-[240px]:py-5 sm:px-7 sm:py-10 text-[#e5eef7] bg-[rgba(15,23,42,0.84)] border border-lime-200/20 backdrop-blur-sm shadow-[0_4px_20px_rgba(2,8,20,0.45),0_20px_45px_rgba(0,0,0,0.35)]">
      <div class="flex flex-col gap-4 min-[320px]:gap-5">
        <div class="grid gap-4 lg:grid-cols-[1.4fr_0.9fr]">
          <div class="rounded-2xl border border-white/10 bg-white/5 p-3 min-[240px]:p-4 sm:p-5">
            <h2 class="flex items-center gap-2 font-semibold text-sm min-[240px]:text-base min-[320px]:text-lg sm:text-2xl text-[#c6d6a0] tracking-[0.01em] mb-4 min-[320px]:mb-5">
              <span class="text-lime-300 text-base min-[240px]:text-lg min-[320px]:text-xl sm:text-2xl leading-none" aria-hidden="true">🍏</span>
              <span>Agregar producto</span>
            </h2>

            <div class="flex flex-col gap-3">
              <label class="text-[10px] min-[180px]:text-[11px] min-[240px]:text-xs min-[320px]:text-sm font-medium text-[#c8d7e8]" for="producto-input">
                Producto que deseas agregar
              </label>
              <div class="flex flex-col gap-3 sm:flex-row sm:items-center">
                <input id="producto-input" type="text" placeholder="Ejemplo: Pan"
                  class="w-full rounded-full px-3 min-[240px]:px-4 py-2 text-sm min-[320px]:text-base bg-white/10 border border-white/20 text-[#e5eef7] placeholder:text-[#9fb0c5] outline-none focus:border-lime-200/60 focus:ring-2 focus:ring-lime-200/20">
                <button id="btnAgregar" type="button"
                  class="inline-block w-full sm:w-auto text-center rounded-full px-4 py-2 text-[#e5eef7] bg-lime-200/10 border border-transparent transition duration-200 hover:translate-x-0.5 hover:bg-lime-200/20 hover:border-lime-200/50 hover:text-[#f7ffd3] no-underline font-semibold">
                  Agregar
                </button>
              </div>
              <div class="grid gap-3 min-[240px]:grid-cols-2">
                <div class="flex flex-col gap-3">
                  <input
                    id="inputPosicion"
                    type="number"
                    min="1"
                    placeholder="Posicion a eliminar"
                    class="w-full rounded-full px-3 min-[240px]:px-4 py-2 text-sm min-[320px]:text-base bg-white/10 border border-white/20 text-[#e5eef7] placeholder:text-[#9fb0c5] outline-none focus:border-amber-200/60 focus:ring-2 focus:ring-amber-200/20"
                  >
                  <button id="btnEliminar" type="button"
                    class="inline-block w-full text-center rounded-full px-4 py-2 text-[#e5eef7] bg-amber-200/10 border border-transparent transition duration-200 hover:bg-amber-200/20 hover:border-amber-200/50 hover:text-[#fff1c2] no-underline font-semibold">
                    Eliminar por posicion
                  </button>
                </div>
                <button id="btnVaciar" type="button"
                  class="inline-block w-full text-center rounded-full px-4 py-2 text-[#e5eef7] bg-rose-200/10 border border-transparent transition duration-200 hover:bg-rose-200/20 hover:border-rose-200/50 hover:text-[#ffe1e8] no-underline font-semibold">
                  Vaciar carrito
                </button>
              </div>
            </div>

            <p id="mensaje" class="mt-4 min-[320px]:mt-5 rounded-xl border border-lime-200/20 bg-lime-200/10 px-3 py-2 text-base min-[320px]:text-lg font-bold text-[#f7ffd3]">&nbsp;</p>
          </div>

          <aside class="rounded-2xl border border-white/10 bg-white/5 p-3 min-[240px]:p-4 sm:p-5">
            <h2 class="font-semibold text-sm min-[240px]:text-base min-[320px]:text-lg sm:text-2xl text-[#c6d6a0] tracking-[0.01em] mb-4 min-[320px]:mb-5">
              Resumen
            </h2>
            <div class="rounded-2xl border border-lime-200/15 bg-lime-200/10 px-4 py-5 text-center">
              <div class="mx-auto mb-2 min-[320px]:mb-3 flex justify-center">
                <svg
                  class="h-9 w-9 min-[220px]:h-10 min-[220px]:w-10 min-[320px]:h-12 min-[320px]:w-12 text-[#c6d6a0]"
                  viewBox="0 0 24 24"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                  aria-hidden="true"
                >
                  <path d="M3 4H5L6.6 14.2C6.72 14.96 7.38 15.5 8.15 15.5H17.7C18.43 15.5 19.07 15.02 19.28 14.32L21 8.5H7.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                  <circle cx="9" cy="19" r="1.6" fill="currentColor"/>
                  <circle cx="18" cy="19" r="1.6" fill="currentColor"/>
                </svg>
              </div>
              <p class="text-[10px] min-[180px]:text-[11px] min-[240px]:text-xs min-[320px]:text-sm uppercase tracking-[0.2em] text-[#9fb0c5]">
                Productos en carrito
              </p>
              <p id="num-prod" class="mt-2 text-3xl min-[240px]:text-4xl font-extrabold text-[#c6d6a0]">0</p>
            </div>
            <a href="index.html"
              class="mt-4 inline-block w-full text-center rounded-full px-4 py-2 text-[#e5eef7] bg-white/10 border border-transparent transition duration-200 hover:bg-white/20 hover:border-white/40 no-underline font-semibold">
              Volver al inicio
            </a>
          </aside>
        </div>

        <div class="rounded-2xl border border-white/10 bg-white/5 p-3 min-[240px]:p-4 sm:p-5">
          <h2 class="font-semibold text-sm min-[240px]:text-base min-[320px]:text-lg sm:text-2xl text-[#c6d6a0] tracking-[0.01em] mb-4 min-[320px]:mb-5">
            Carrito actual
          </h2>
          <ol start="1" id="lista-compras" class="list-decimal list-inside space-y-2 text-[10px] min-[180px]:text-[11px] min-[240px]:text-xs min-[320px]:text-sm sm:text-base text-[#c8d7e8]"></ol>
        </div>
      </div>
    </section>
  </main>

  <script src="./js/lista.js"></script>
</body>

</html>
