<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Solar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="shortcut icon" href="./img/solar.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @import "tailwindcss";
    </style>
</head>

<body
    class="relative min-h-screen overflow-x-hidden font-[Outfit,Segoe_UI,Tahoma,Geneva,Verdana,sans-serif] text-[#e5eef7] bg-linear-to-br from-[#091833] via-[#114b5f] to-[#1a936f]">

    <div
        class="pointer-events-none absolute -left-10 -top-14 z-0 h-[180px] w-[180px] min-[220px]:h-[220px] min-[220px]:w-[220px] min-[320px]:h-[280px] min-[320px]:w-[280px] rounded-full bg-[#29f2ff] opacity-25 min-[220px]:opacity-35 blur-[70px] min-[320px]:blur-[80px] motion-safe:animate-pulse motion-reduce:animate-none">
    </div>
    <div
        class="pointer-events-none absolute -right-20 top-[30%] z-0 h-[190px] w-[190px] min-[220px]:h-[230px] min-[220px]:w-[230px] min-[320px]:h-[300px] min-[320px]:w-[300px] rounded-full bg-[#d9ff00] opacity-25 min-[220px]:opacity-35 blur-[70px] min-[320px]:blur-[80px] motion-safe:animate-pulse motion-reduce:animate-none [animation-delay:1.2s]">
    </div>
    <div
        class="pointer-events-none absolute -bottom-14 min-[320px]:-bottom-20 left-[30%] min-[320px]:left-[35%] z-0 h-[170px] w-[170px] min-[220px]:h-[210px] min-[220px]:w-[210px] min-[320px]:h-[260px] min-[320px]:w-[260px] rounded-full bg-[#00e5a8] opacity-25 min-[220px]:opacity-35 blur-[65px] min-[320px]:blur-[80px] motion-safe:animate-pulse motion-reduce:animate-none [animation-delay:2s]">
    </div>

    <main
        class="relative z-10 py-2 px-1 min-[180px]:py-2.5 min-[180px]:px-1.5 min-[240px]:py-4 min-[240px]:px-2 min-[320px]:py-6 min-[320px]:px-3 sm:py-12 sm:px-4 md:py-16">

        <h1
            class="text-center text-[13px] min-[180px]:text-[15px] min-[240px]:text-xl min-[320px]:text-2xl sm:text-4xl md:text-5xl font-extrabold text-[#c6d6a0] mb-2 min-[240px]:mb-3 sm:mb-5 tracking-tight leading-tight px-1">
            El Sistema Solar
        </h1>
        <p
            class="mx-auto max-w-4xl text-center text-[9px] min-[180px]:text-[10px] min-[240px]:text-xs min-[320px]:text-sm sm:text-base font-semibold text-[#b7c6d9] leading-relaxed px-1 mb-4 sm:mb-8">
            Selecciona un astro para ver su imagen
        </p>

        <div class="flex flex-wrap justify-center gap-2 min-[320px]:gap-3 mb-4 sm:mb-8">
            <a href="index.html"
                class="rounded-full px-3 min-[240px]:px-4 py-1.5 min-[240px]:py-2 text-[10px] min-[240px]:text-xs min-[320px]:text-sm font-semibold text-[#e5eef7] bg-lime-200/10 border border-lime-200/30 transition duration-200 hover:bg-lime-200/25 hover:border-lime-200/60 hover:text-[#f7ffd3] cursor-pointer no-underline">
                Volver a inicio
            </a>
            <button id="btnTerminar" type="button"
                class="rounded-full px-3 min-[240px]:px-4 py-1.5 min-[240px]:py-2 text-[10px] min-[240px]:text-xs min-[320px]:text-sm font-semibold text-[#e5eef7] bg-red-400/10 border border-red-400/30 transition duration-200 hover:bg-red-400/25 hover:border-red-400/60 hover:text-red-200 cursor-pointer">
                Terminar
            </button>
        </div>

        <hr class="my-3 sm:my-6 mx-auto w-full max-w-7xl border-0 border-t-2 border-lime-200/20">

        <section
            class="mt-3 min-[320px]:mt-4 sm:mt-6 mx-auto w-full max-w-5xl rounded-2xl px-2 py-3 min-[200px]:px-2.5 min-[200px]:py-4 min-[240px]:px-3 min-[240px]:py-5 min-[320px]:px-4 min-[320px]:py-6 sm:w-[92%] sm:px-6 sm:py-10 bg-[rgba(15,23,42,0.84)] border border-lime-200/20 backdrop-blur-sm shadow-[0_4px_20px_rgba(2,8,20,0.45),0_20px_45px_rgba(0,0,0,0.35)] md:w-[80%] md:px-10 md:py-12">

            <h2
                class="font-semibold text-sm min-[240px]:text-base min-[320px]:text-lg sm:text-2xl text-[#c6d6a0] mb-4 sm:mb-6">
                Seleccione el astro deseado
            </h2>

            <div class="flex flex-col sm:flex-row gap-4 sm:gap-8 items-start">

                <aside class="w-full sm:w-auto">
                    <div id="astros" aria-label="Lista de astros"
                        class="w-full sm:w-48 rounded-xl border border-lime-200/30 bg-[rgba(9,24,51,0.85)] overflow-y-auto max-h-44 sm:max-h-60 divide-y divide-lime-200/10">
                        <button type="button" data-src="./img/mercurio.jpg"
                            class="astro-item w-full text-left px-3 py-1.5 text-[10px] min-[240px]:text-xs min-[320px]:text-sm sm:text-base cursor-pointer transition duration-200 hover:bg-lime-200/25 hover:text-[#f7ffd3] bg-lime-200/25 text-[#f7ffd3]">
                            Mercurio</button>
                        <button type="button" data-src="./img/venus.jpg"
                            class="astro-item w-full text-left px-3 py-1.5 text-[10px] min-[240px]:text-xs min-[320px]:text-sm sm:text-base text-[#e5eef7] cursor-pointer transition duration-200 hover:bg-lime-200/25 hover:text-[#f7ffd3]">
                            Venus</button>
                        <button type="button" data-src="./img/tierra.jpg"
                            class="astro-item w-full text-left px-3 py-1.5 text-[10px] min-[240px]:text-xs min-[320px]:text-sm sm:text-base text-[#e5eef7] cursor-pointer transition duration-200 hover:bg-lime-200/25 hover:text-[#f7ffd3]">
                            La Tierra</button>
                        <button type="button" data-src="./img/marte.jpg"
                            class="astro-item w-full text-left px-3 py-1.5 text-[10px] min-[240px]:text-xs min-[320px]:text-sm sm:text-base text-[#e5eef7] cursor-pointer transition duration-200 hover:bg-lime-200/25 hover:text-[#f7ffd3]">
                            Marte</button>
                        <button type="button" data-src="./img/jupiter.jpg"
                            class="astro-item w-full text-left px-3 py-1.5 text-[10px] min-[240px]:text-xs min-[320px]:text-sm sm:text-base text-[#e5eef7] cursor-pointer transition duration-200 hover:bg-lime-200/25 hover:text-[#f7ffd3]">
                            Jupiter</button>
                        <button type="button" data-src="./img/saturno.jpg"
                            class="astro-item w-full text-left px-3 py-1.5 text-[10px] min-[240px]:text-xs min-[320px]:text-sm sm:text-base text-[#e5eef7] cursor-pointer transition duration-200 hover:bg-lime-200/25 hover:text-[#f7ffd3]">
                            Saturno</button>
                        <button type="button" data-src="./img/neptuno.jpg"
                            class="astro-item w-full text-left px-3 py-1.5 text-[10px] min-[240px]:text-xs min-[320px]:text-sm sm:text-base text-[#e5eef7] cursor-pointer transition duration-200 hover:bg-lime-200/25 hover:text-[#f7ffd3]">
                            Neptuno</button>
                        <button type="button" data-src="./img/urano.jpg"
                            class="astro-item w-full text-left px-3 py-1.5 text-[10px] min-[240px]:text-xs min-[320px]:text-sm sm:text-base text-[#e5eef7] cursor-pointer transition duration-200 hover:bg-lime-200/25 hover:text-[#f7ffd3]">
                            Urano</button>
                        <button type="button" data-src="./img/pluton.jpg"
                            class="astro-item w-full text-left px-3 py-1.5 text-[10px] min-[240px]:text-xs min-[320px]:text-sm sm:text-base text-[#e5eef7] cursor-pointer transition duration-200 hover:bg-lime-200/25 hover:text-[#f7ffd3]">
                            Pluton</button>
                    </div>
                </aside>

                <div
                    class="w-full flex-1 flex justify-center items-center min-h-[120px] min-[320px]:min-h-[180px] sm:min-h-[260px]">
                    <img id="planeta" src="./img/mercurio.jpg" alt="foto"
                        class="w-[min(100%,220px)] h-32 min-[320px]:w-[min(100%,300px)] min-[320px]:h-48 sm:w-[min(100%,420px)] sm:h-72 object-contain rounded-2xl shadow-[0_4px_30px_rgba(0,229,168,0.18)]">
                </div>

            </div>
        </section>
    </main>

    <script src="./js/sistema.js"></script>
</body>

</html>
